[project]
name = "sec_adv_ingestion"
version = "0.1.0"
description = "SEC Form ADV ingestion pipeline"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
    "duckdb",
    "psutil",
    "rich",
    "lxml",
    "typer",
    "click",
    "SQLAlchemy",
    "pydantic-settings",
    "psycopg[binary]",
    "pyarrow",
    "boto3>=1.35,<2",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "langchain-ollama>=0.3,<2",
    "langgraph>=1.0,<2",
    "langsmith>=0.4,<1",
]
requires-python = ">=3.12"

[project.optional-dependencies]
delta = ["deltalake>=0.25,<2", "pyarrow>=15"]

[project.scripts]
sec-pipeline = "src.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--ignore=src/pipeline_test.py"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
