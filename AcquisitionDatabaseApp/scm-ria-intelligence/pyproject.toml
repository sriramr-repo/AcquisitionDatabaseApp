"[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scm-ria-intelligence"
version = "0.1.0"
description = "SCM RIA Acquisition Intelligence Platform"
readme = "README.md"
authors = [{name = "Standish Capital Management"}]
license = {text = "Proprietary"}
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "sqlite3>=0.0.1",  # Built-in, but included for clarity
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]
research = [
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/standish-capital/scm-ria-intelligence"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = ["E501"]  # line length handled by black
line-length = 88
target-version = "py312"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow running tests",
]

[project.scripts]
scm-ria = "src.cli:app"